name = "warframe-mcp"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "WarframeMcpContainer"
image = "./Dockerfile"
max_instances = 3
instance_type = "basic"

[[durable_objects.bindings]]
name = "WARFRAME_MCP"
class_name = "WarframeMcpContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WarframeMcpContainer"]
