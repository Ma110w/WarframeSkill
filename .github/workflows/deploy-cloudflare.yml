# Builds the Container image on GitHub (not on your PC) and deploys to Cloudflare.
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — Account API token with Workers Scripts Edit + Containers Edit
#   CLOUDFLARE_ACCOUNT_ID — 18226a73a8a43f667d3ed3bd3fbbdd39 (snakeplisken47)

name: Deploy Cloudflare Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "wrangler.toml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "http_app.py"
      - "server.py"
      - "clients.py"
      - "overframe.py"
      - "platinum.py"
      - "requirements.txt"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
